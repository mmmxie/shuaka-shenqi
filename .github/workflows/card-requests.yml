name: 卡片請求即時處理

on:
  # 排程已於 2026/08/19 停用：CLAUDE_CODE_OAUTH_TOKEN 過期，每 30 分鐘排程一跑就失敗並寄失敗信。
  # 需要時把下面兩行取消註解即可恢復自動處理加卡請求。
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:        # 保留手動觸發（Actions 頁面可 Run workflow）

permissions:
  contents: write           # 讓 Action 能 commit + push

jobs:
  process-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝 Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: 處理 pending 卡片請求
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash ci/process_requests.sh

      - name: Commit & push 變更
        run: |
          git config user.name "shuaka-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "無變更"
          else
            git commit -m "處理卡片請求 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
